          <div><h1 class="text-xl sm:text-2xl font-extrabold tracking-wider neon-cyan">👑 Day-Group 󠁯● PANEL RESULT</h1><p class="text-[10px] text-cyan-400/70 font-semibold tracking-widest -mt-1">INNOVATION STARTS HERE • DESIGN BY KD</p></div>

        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
        <div class="lg:col-span-5 flex flex-col gap-3">
  <div class="glass-card rounded-2xl p-4 flex flex-col gap-3 h-full">
    <div class="flex items-center gap-2 text-xs font-bold text-slate-300 tracking-wider mb-1">
      <i class="fa-solid fa-square-arrow-down text-cyan-400"></i> INPUT RESULT DATA

    <div class="grid grid-cols-2 gap-2">
        <select id="marketSelect" class="bg-black/40 border border-white/10 rounded-xl p-3 text-xs font-bold text-white focus:outline-none focus:border-cyan-500">
          <option value="">-- Pilih Pasaran --</option>
      <option value="TOTOMACAU-13">TOTOMACAU-13</option>
      <option value="TOTOMACAU-16">TOTOMACAU-16</option>

      <option value="TOTOMACAU-00">TOTOMACAU-00</option>
      <option value="TOTOMACAU-15-5D">TOTOMACAU-15-5D</option>
      <option value="TOTOMACAU-21-5D">TOTOMACAU-21-5D</option>
          </select>
        <input type="text" id="angkaInput" placeholder="Angka" class="bg-black/40 border border-white/10 rounded-xl p-3 text-xs font-mono text-white focus:outline-none focus:border-cyan-500">
    </div>
    
    <button onclick="sendToPanelZ()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-3 rounded-xl active:scale-95 transition-all">

    <div class="mt-2 border-t border-white/5 pt-3">
        <span class="text-[10px] text-slate-400 font-bold mb-2 block">AUTO-SEND RAW DATA:</span>
        <textarea id="inputText" oninput="autoGenerate()" placeholder="Paste raw text result di sini..." class="w-full h-40 bg-black/40 border border-white/5 rounded-xl p-3 text-xs font-mono focus:outline-none focus:border-cyan-500 transition-all resize-none"></textarea>
    </div>
  </div>
</div>
        <div class="lg:col-span-7 flex flex-col gap-3">
          <div class="glass-card rounded-2xl p-4 flex flex-col gap-4">

            <div class="grid grid-cols-3 gap-3">
               <div class="glass-inner rounded-xl p-3 flex flex-col justify-between min-h-[90px] shadow-md relative overflow-hidden">
                <span class="text-[10px] font-bold text-slate-400">ANGKA 2D</span>
                <div id="twoDigit" class="text-2xl font-black font-mono neon-gold mt-1">-</div>
              </div>
              <div class="glass-inner rounded-xl p-3 flex flex-col justify-between min-h-[90px] shadow-md relative overflow-hidden">
                <span class="text-[10px] font-bold text-slate-400">SHIO</span>
                <div id="shio-box" class="text-lg font-extrabold text-emerald-400 truncate mt-2"><span id="shio-icon" class="mr-1"></span><span id="shio">-</span></div>
              </div>
              <div class="glass-inner rounded-xl p-3 flex flex-col justify-between min-h-[90px] shadow-md relative overflow-hidden">
                <span class="text-[10px] font-bold text-slate-400">STATUS</span>
                <div id="status" class="text-lg font-black tracking-wider text-slate-400 mt-2">-</div>

            <div class="flex flex-col gap-1">
              <span class="text-[10px] font-bold text-slate-400">LIVE PREVIEW OUTPUT</span>
              <div id="outputPreview" class="w-full h-32 bg-black/50 border border-white/5 rounded-xl p-3 text-xs font-mono text-cyan-300/90 overflow-y-auto whitespace-pre-wrap"></div>
            </div>
            <div class="grid grid-cols-1 gap-2.5 mt-2">
              <button onclick="triggerAutoSend()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-700 text-white font-bold text-xs py-3 rounded-xl active:scale-95 transition-all shadow-lg shadow-purple-900/20">
                <i class="fa-solid fa-paper-plane mr-2"></i> SEND ALL SYSTEMS (TELEGRAM + LINKTREE + PANEL-Z)
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2.5">
        <button onclick="copyPrize1()" class="bg-gradient-to-br from-emerald-600 to-teal-700 text-white font-bold text-xs py-3 rounded-xl active:scale-95 transition-all"><i class="fa-solid fa-circle-1"></i> PRIZE 1</button>
        <button onclick="copyPrize2()" class="bg-gradient-to-br from-amber-600 to-orange-700 text-white font-bold text-xs py-3 rounded-xl active:scale-95 transition-all"><i class="fa-solid fa-circle-2"></i> PRIZE 2</button>
        <button onclick="copyPrize3()" class="bg-gradient-to-br from-pink-600 to-rose-700 text-white font-bold text-xs py-3 rounded-xl active:scale-95 transition-all"><i class="fa-solid fa-circle-3"></i> PRIZE 3</button>
        <button onclick="copyTelegram()" class="bg-gradient-to-br from-sky-600 to-blue-700 text-white font-bold text-xs py-3 rounded-xl active:scale-95 transition-all col-span-2 sm:col-span-1"><i class="fa-brands fa-telegram"></i> TELEGRAM</button>
        <button onclick="copyLinktree1()" class="bg-gradient-to-br from-cyan-600 to-blue-800 text-white font-bold text-xs py-3 rounded-xl active:scale-95 transition-all">Title LinkTree</button>

<style>
.toast-notif{
    position:fixed;
    top:20px;
    right:20px;
    min-width:300px;
    max-width:500px;
    background:#1f2937;
    color:#fff;
    padding:15px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,.3);
    z-index:99999;
    display:none;
}

.toast-notif button{
    margin-top:10px;
    border:none;
    padding:8px 15px;
    border-radius:6px;
    cursor:pointer;
}
</style>

<script>
  let currentUser = "";
  let resultData = {};
  const shioIcons = { "KUDA": "🐴", "ULAR": "🐍", "NAGA": "🐉", "KELINCI": "🐇", "HARIMAU": "🐅", "KERBAU": "🐃", "TIKUS": "🐀", "BABI": "🐖", "ANJING": "🐕", "AYAM": "🐓", "MONYET": "🐒", "KAMBING": "🐐" };

  function handleLogin() {
    const u = document.getElementById('user').value;
    const p = document.getElementById('pass').value;
    const btn = document.getElementById('btnLogin');
    const err = document.getElementById('login-err');
    if(!u || !p) { err.innerText = "Lengkapi data!"; return; }
    btn.innerText = "AUTHENTICATING...";
    btn.disabled = true;
    google.script.run.withSuccessHandler(res => {
      if(res.success) {
        currentUser = u;
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-panel').style.display = 'flex';
        document.body.classList.remove('justify-center');
        toast("Selamat Datang, " + res.user);
      } else {
        err.innerText = res.message;
        btn.innerText = "AUTHORIZE ACCESS";
        btn.disabled = false;
      }
    }).checkLogin(u, p);
  }

  function updateClock() {
    const now = new Date();
    document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
    document.getElementById('live-date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase();
  }
  setInterval(updateClock, 1000); updateClock();

  function toast(message) {
    const toastBox = document.getElementById('toast');
    document.getElementById('toast-msg').innerText = message;
    toastBox.style.transform = "translateY(0)"; toastBox.style.opacity = "1";
    setTimeout(() => { toastBox.style.transform = "translateY(-100px)"; toastBox.style.opacity = "0"; }, 1800);
  }

  function autoGenerate() {
    clearTimeout(window.t);
    const txt = document.getElementById('inputText').value;
    if (!txt.trim()) { resetMonitor(); return; }
    window.t = setTimeout(() => { google.script.run.withSuccessHandler(showResult).processText(txt); }, 50);
  }

  function showResult(res) {
    resultData = res || {};
    const marketEl = document.getElementById('market');
    marketEl.innerText = res.market || '-';
    marketEl.className = (res.market && res.market !== '-' && res.market !== 'UNKNOWN') ? "text-xl font-extrabold text-white tracking-widest animate-market" : "text-xl font-extrabold text-white tracking-widest";
    document.getElementById('twoDigit').innerText = res.twoDigit !== '' ? String(res.twoDigit).padStart(2, '0') : '-';
    document.getElementById('shio').innerText = res.shio || '-';
    document.getElementById('shio-icon').innerText = shioIcons[res.shio] || '';
    const st = document.getElementById('status'); st.innerText = res.status || '-';
    st.className = res.status === 'BENAR' ? "text-lg font-black tracking-wider text-emerald-400 neon-cyan" : (res.status === 'SALAH' ? "text-lg font-black tracking-wider text-rose-500" : "text-lg font-black tracking-wider text-slate-400");
    document.getElementById('outputPreview').innerText = res.output || '';
  }

  function copyPrize1() { if(resultData.prize1){ navigator.clipboard.writeText(resultData.prize1); toast('Prize 1 Disalin!'); } else { toast('Data kosong'); } }
  function copyPrize2() { if(resultData.prize2){ navigator.clipboard.writeText(resultData.prize2); toast('Prize 2 Disalin!'); } else { toast('Data kosong'); } }
  function copyPrize3() { if(resultData.prize3){ navigator.clipboard.writeText(resultData.prize3); toast('Prize 3 Disalin!'); } else { toast('Data kosong'); } }
  
  function copyTelegram() { 
    if(resultData.output){ 
      navigator.clipboard.writeText(resultData.output); 
      toast('🚀 Format Telegram Disalin!'); 
      google.script.run.logActivity(currentUser, "Copy Telegram", resultData.output); 
    } else { toast('❌ Output Teks kosong'); } 
  }

  function resetMonitor() {
    resultData = {};
    document.getElementById('market').innerText = '-';
    document.getElementById('twoDigit').innerText = '-';
    document.getElementById('shio').innerText = '-';
    document.getElementById('shio-icon').innerText = '';
    document.getElementById('status').innerText = '-';
    document.getElementById('outputPreview').innerText = '';
  }

  function triggerAutoSend() {

  const txt =
    document.getElementById('inputText').value;

  if (!txt) {

    toast("❌ Input Data Kosong!");
    return;

  }

  toast("⏳ Memproses...");

  console.log("USER =", currentUser);

  google.script.run

    .withSuccessHandler(function(result){

      showSendResult(result);

    })

    .withFailureHandler(function(err){

      showToast(
        "❌ Error : " + err.message
      );

    })

    .sendAllSystems(
      txt,
      currentUser
    );

}

     function copyLinktree1() { 
      if(resultData.market){ 
        // Mengubah format judul
        const title = 'Hasil Pengeluaran Pasaran ' + resultData.market;
        navigator.clipboard.writeText(title); 
        toast('Title Linktree Disalin!'); 
        google.script.run.logActivity(currentUser, "Copy Title Linktree", title); 
      }
    }

    function copyLinktree2() { 
      if(resultData.prize1){ 
        let pesan = `🅿️1️⃣ : ${resultData.prize1}`;
        
        // Cek jika Prize 2 ada isinya
        if(resultData.prize2 && resultData.prize2 !== "") {
           pesan += `  🅿️2️⃣ : ${resultData.prize2}`;
        }
        
        // Cek jika Prize 3 ada isinya
        if(resultData.prize3 && resultData.prize3 !== "") {
           pesan += `  🅿️3️⃣ : ${resultData.prize3}`;
        }
        
        navigator.clipboard.writeText(pesan); 
        toast('Pesan Linktree Disalin!'); 
        google.script.run.logActivity(currentUser, "Copy Pesan Linktree", pesan); 
      } else {
        toast('❌ Data Prize kosong');
      }
    }

    function copyPanelZ() { 
      if(resultData.prize1){ 
        navigator.clipboard.writeText(resultData.prize1); 
        toast('Data Panel-Z Disalin!'); 
        google.script.run.logActivity(currentUser, "Copy Panel-Z", "Pasaran: " + resultData.market + " | Angka: " + resultData.prize1); 
      } else { toast('Data kosong'); }
    }
</script>

<script>
function showToast(message){

    const toast = document.getElementById("toastNotif");
    const text  = document.getElementById("toastText");

    text.innerHTML = message;

    toast.style.display = "block";

    clearTimeout(window.toastTimer);

    window.toastTimer = setTimeout(()=>{
        toast.style.display = "none";
    },5000);
}

function closeToast(){
    document.getElementById("toastNotif").style.display = "none";
}
</script>
<script>
function showSendResult(result){

  document.getElementById("modalResult").innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px;font-size:14px;">
      <div>📨 Telegram : <b>${result.telegram}</b></div>
      <div>🌳 LinkTree : <b>${result.linktree}</b></div>
      <div>⚙️ Panel-Z : <b>${result.panelz}</b></div>
    </div>
  `;

  document.getElementById("resultModal").style.display = "flex";
}
</script>

<!-- MODAL RESULT -->
<div id="resultModal"
     style="display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.7);
            z-index:99999;
            justify-content:center;
            align-items:center;">

  <div style="background:#111827;
              color:white;
              padding:20px;
              border-radius:16px;
              width:90%;
              max-width:500px;
              text-align:center;">

    <h2 style="font-size:20px;font-weight:bold;margin-bottom:15px;">
      📤 HASIL PENGIRIMAN
    </h2>

    <div id="modalResult"></div>

    <button onclick="closeModal()"
            style="margin-top:15px;
                   background:#4f46e5;
                   color:white;
                   border:none;
                   padding:10px 20px;
                   border-radius:10px;
                   cursor:pointer;">
      Tutup
    </button>

  </div>
</div>

<script>

function closeModal(){
  document.getElementById("resultModal").style.display = "none";
}

function sendToPanelZ(){

  const market = document.getElementById('marketSelect').value;
  const angka  = document.getElementById('angkaInput').value;

  if(!market || !angka){
    toast("❌ Pilih pasaran dan isi angka!");
    return;
  }

  toast("⏳ Mengirim ke Panel-Z...");

  google.script.run
    .withSuccessHandler(function(res){

      document.getElementById("modalResult").innerHTML = `
        <div style="display:flex;flex-direction:column;gap:12px;font-size:14px;">
            <div>⚙️ Panel-Z : <b>${res.message || "Berhasil"}</b></div>
            <div>📍 Pasaran : <b>${market}</b></div>
            <div>🎯 Angka : <b>${angka}</b></div>
        </div>
      `;

      document.getElementById("resultModal").style.display = "flex";

      toast("✅ Berhasil Mengirim ke Panel-Z");

    })
    .withFailureHandler(function(err){

      toast("❌ Error : " + err.message);

    })
    .sendToPanelZOnly(
      market,
      angka,
      currentUser
    );
}
</script>
